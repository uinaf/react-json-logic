name: Bug report
description: Report incorrect behavior
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is happening
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Exact steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, package manager, and OS details

  - type: textarea
    id: additional
    attributes:
      label: Additional context
