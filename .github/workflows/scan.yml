name: Scan

# No push trigger: pull requests scan the same tree before merge and the
# weekly schedule covers history.
on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    uses: uinaf/.github/.github/workflows/scan.yml@main
