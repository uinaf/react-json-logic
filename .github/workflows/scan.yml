name: Scan

on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    uses: uinaf/.github/.github/workflows/scan.yml@ce25bc56a1a5c182e8bef402b3eceaca331608a1 # v1.0.1
