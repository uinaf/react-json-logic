name: Scan

# No push trigger: pull requests already scan the full history, because the
# shared baseline checks out with `fetch-depth: 0`. The weekly run is for the
# scanners that consult live state - TruffleHog reports only credentials it can
# verify, and zizmor's online audits read GitHub - so a secret that was inactive
# at commit time is caught once it becomes valid. Gitleaks and actionlint are
# digest-pinned and offline, so they return the same answer every week.
on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    # Tracks main by design: baseline changes reach every adopter without a
    # pin bump per repository. Renovate is configured not to update
    # `uinaf/.github` references, so a pin here would only ever move if someone
    # bumped it by hand.
    uses: uinaf/.github/.github/workflows/scan.yml@main
